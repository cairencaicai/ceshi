name: iOS Build (public runner)
# 用途：一个只放 workflow 的公开仓库，用公开库的免费 macOS 额度替私有仓库 cairencaicai/esp32 出 ipa。
# 源码不进这个仓库：运行期用 SRC_TOKEN 把私有库 checkout 下来；ipa 发回私有库 Release；公开这边不留产物。
# 触发：私有库推送后由本机脚本 POST /repos/{owner}/ceshi/dispatches （event_type = ios-build）。
on:
  repository_dispatch:
    types: [ios-build]
  workflow_dispatch:
    inputs:
      sha:
        description: 要构建的私有库 commit（留空 = main）
        required: false

permissions:
  contents: read          # 只读本仓库（本仓库里只有这个 workflow）

concurrency:
  group: motonav-ios-public
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      # ── 换成"拉私有库" ───────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          repository: cairencaicai/esp32
          ref: ${{ github.event.client_payload.sha || inputs.sha || 'main' }}
          token: ${{ secrets.SRC_TOKEN }}
          fetch-depth: 0          # 后面 git archive 打包源码要用完整历史
          persist-credentials: false

      - name: Show target commit
        run: git log -1 --format='%H %s'

      # ── 以下步骤与私有库 release-ios.yml 保持一致 ──────────────────
      # 想省钱可以删掉 4 个与歌词无关的自检（map-export / map transport / navigation,ble clock /
      # four-styles+map-delivery），能省 1~2 分钟；留着更稳。
      - name: Verify report export and record recovery
        run: |
          swiftc ios/MotoNav/MapReportExport.swift ios/tests/map-export/main.swift -o /tmp/map-export
          /tmp/map-export

      - name: Verify map transport and published receiver
        run: |
          set -euo pipefail
          cmp ios/tests/building-continuity/fixture/RasterBuildingCarry.h firmware/boards/175/MotoNav/RasterBuildingCarry.h
          cmp ios/tests/building-continuity/fixture/RasterContinuity.h firmware/boards/175/MotoNav/RasterContinuity.h
          cmp ios/tests/building-continuity/fixture/src/map/RasterDecoder.h firmware/boards/175/MotoNav/src/map/RasterDecoder.h
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/map-wire/main.swift -o /tmp/map-wire
          /tmp/map-wire
          clang++ -std=c++17 ios/tests/map-wire/receiver.cpp -o /tmp/bulk-receiver
          /tmp/bulk-receiver
          clang++ -std=c++17 -O2 ios/tests/building-continuity/main.cpp -o /tmp/building-continuity
          /tmp/building-continuity

      - uses: actions/cache/restore@v4
        id: pods
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Reuse previously verified public SDK cache
        if: steps.pods.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/LockedSDK" "$HOME/Library/Caches"
          if gh run download 41173836576 -R zyn950929/MotoNav -n ios-locked-pods-cache -D "$RUNNER_TEMP/LockedSDK"; then
            tar -xzf "$RUNNER_TEMP/LockedSDK/ios-locked-pods-cache.tar.gz" -C "$HOME/Library/Caches"
          else
            echo 'Verified cache unavailable; CocoaPods will download the locked SDK versions.'
          fi

      - name: Install locked dependencies
        timeout-minutes: 28
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            if sudo gem install cocoapods -v 1.16.2 --no-document; then break; fi
            echo "gem install attempt $attempt failed, retrying"; sleep 25
          done
          for attempt in 1 2 3; do
            if pod _1.16.2_ install --deployment; then break; fi
            echo "pod install attempt $attempt failed, retrying"; sleep 40
          done
          test -d Pods && test -f Podfile.lock

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}

      - name: Verify navigation, BLE clock and route history
        run: |
          set -euo pipefail
          python3 ios/tests/webmotor/check.py | tee parity-tests.log
          python3 ios/tests/screenoff-maps/run.py | tee screenoff-tests.log
          python3 ios/tests/reroute-recovery/run.py | tee reroute-tests.log
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/tests/arrival/main.swift -o /tmp/arrival
          /tmp/arrival
          clang++ -std=c++17 ios/tests/phone-clock/receiver.cpp -o /tmp/clock-receiver
          /tmp/clock-receiver
          swiftc ios/MotoNav/AMSMetadata.swift ios/tests/music/main.swift -o /tmp/music
          /tmp/music
          swiftc ios/MotoNav/ArrivalPolicy.swift ios/MotoNav/NaviSessionCallbacks.swift ios/tests/arrival-relay/SDKStubs.swift ios/tests/arrival-relay/main.swift -o /tmp/relay
          /tmp/relay
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/MapStyles.swift ios/tests/four-styles/main.swift -o /tmp/styles
          /tmp/styles
          swiftc -O ios/MotoNav/MapGeo.swift ios/MotoNav/RasterProcessing.swift ios/MotoNav/MapStyles.swift ios/MotoNav/RouteMapPlan.swift ios/tests/map-delivery/main.swift -o /tmp/map-delivery
          /tmp/map-delivery
          swiftc ios/MotoNav/BleBulkWriteQueue.swift ios/MotoNav/BleWritePacer.swift ios/tests/ble-bulk/main.swift -o /tmp/bulk
          /tmp/bulk

      - name: Build iPhone Release arm64 and unsigned IPA
        env:
          MOTONAV_DERIVED_DATA: ${{ runner.temp }}/Derived
        run: |
          set -o pipefail
          bash scripts/build-ios-ipa.sh | tee build-ios.log

      - name: Package matching iOS source
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=MotoNav/ -o output/ios/MotoNav-iOS-0.16.2-build16-Source.zip HEAD ios firmware/boards/175 build-ios.sh scripts/build-ios-ipa.sh .github/workflows/release-ios.yml LICENSE.md licenses
          (cd output/ios && shasum -a 256 *.ipa *.zip > SHA256SUMS.txt)

      - name: Verify icon and identify artifact
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/MotoNav.app"
          python3 - "$APP" <<'PY'
          import pathlib,plistlib,struct,sys,json,hashlib,shutil
          app=pathlib.Path(sys.argv[1])
          src=pathlib.Path('ios/MotoNav/Assets.xcassets/AppIcon.appiconset/icon.png')
          raw=src.read_bytes()
          assert struct.unpack('>II',raw[16:24])==(1024,1024) and raw[25]==2
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName']=='AppIcon'
          icons=list(app.glob('AppIcon*.png'))
          assert icons
          record={'sourceSHA256':hashlib.sha256(raw).hexdigest(),'sourceSize':[1024,1024],'opaqueRGB':True,'compiledIconFiles':[p.name for p in icons],'bundleVersion':info['CFBundleVersion']}
          pathlib.Path('output/ios/icon-verification.json').write_text(json.dumps(record,indent=2))
          shutil.copy2(src,'output/ios/icon-preview.png')
          print('PASS 1024x1024 opaque icon and compiled AppIcon bundle entries')
          PY
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" >> "$GITHUB_OUTPUT"

      # ── 与私有库唯一不同的一处：Release 发回私有库，不进这个公开仓 ──
      - name: Publish unsigned IPA to private repo release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/MotoNav.app"
          V=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          B=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          TAG="ios-$V-build$B-unsigned"
          gh release delete "$TAG" -R cairencaicai/esp32 --yes --cleanup-tag || true
          gh release create "$TAG" output/ios/*.ipa output/ios/SHA256SUMS.txt \
            -R cairencaicai/esp32 \
            --title "MotoNav iOS $V build$B (unsigned)" \
            --notes "Unsigned IPA built on macos-15-intel (public-runner run ${{ github.run_number }})."

      # 不再 upload-artifact：公开仓的 artifact 谁都能下，ipa 会跟着泄露；
      # 日志本来在 run 页面就能看，不需要另存。
